<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101010">
    <meta name="description" content="Consultoria, suplementos e canal de Killyan Scherk.">
    <title>Killyan Scherk | Links</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/links-assets/favicon.png">
    <style>
        :root {
            color-scheme: dark;
            --background: #101010;
            --surface: #191919;
            --text: #f5f3ee;
            --muted: #b8b6b0;
            --line: #373530;
            --yellow: #ffc700;
        }

        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            color: var(--text);
            background: var(--background);
            font: 400 1rem/1.45 "Helvetica Neue", Helvetica, Arial, sans-serif;
        }
        h1, p { margin: 0; }
        a { color: inherit; text-decoration: none; }
        a:focus-visible { outline: 2px solid var(--yellow); outline-offset: 4px; }
        main {
            width: min(1050px, 100% - 80px);
            min-height: 100vh;
            min-height: 100svh;
            margin-inline: auto;
            display: grid;
            grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr);
            align-content: center;
            align-items: center;
            gap: clamp(2rem, 7vw, 5.5rem);
            padding-block: clamp(2rem, 7vh, 5rem);
        }

        .profile { padding-block: 1rem; }
        .portrait {
            display: block;
            width: clamp(112px, 16vw, 164px);
            height: auto;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 50%;
            border: 1px solid var(--line);
            margin-bottom: 1.35rem;
        }
        h1 {
            font-size: clamp(3rem, 5.3vw, 5.5rem);
            line-height: .95;
            font-weight: 700;
            letter-spacing: -.068em;
        }
        h1 span { display: block; }
        .profile p { margin-top: .85rem; color: var(--muted); }
        .profile .handle { margin-top: .4rem; color: var(--yellow); font-weight: 700; }

        .links { display: grid; gap: 9px; list-style: none; padding: 0; margin: 0; }
        .link {
            min-height: 66px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 1rem;
            padding: .8rem 1rem;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 9px;
            transition: background .16s, border-color .16s;
        }
        .link:hover { background: #24221b; border-color: var(--yellow); }
        .link strong { display: block; font-size: 1.02rem; line-height: 1.25; }
        .link small { display: block; margin-top: .22rem; color: var(--muted); font-size: .85rem; }
        .arrow { color: var(--yellow); font-size: 1.25rem; line-height: 1; }
        .link.primary { background: var(--yellow); border-color: var(--yellow); color: #141005; }
        .link.primary:hover { background: #ffdb52; border-color: #ffdb52; }
        .primary small, .primary .arrow { color: inherit; }
        .coupon { color: var(--yellow); font-weight: 700; }

        footer {
            margin-top: 1.2rem;
            border-top: 1px solid var(--line);
            padding-top: .65rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: .1rem 1rem;
            font-size: .86rem;
            color: var(--muted);
        }
        footer a { display: inline-flex; align-items: center; min-height: 44px; gap: .35rem; }
        footer a:hover { color: var(--yellow); text-decoration: underline; text-underline-offset: .2em; }
        .media-kit { color: var(--yellow); font-weight: 700; }

        @media (max-width: 700px) {
            main { width: min(480px, 100% - 36px); min-height: auto; grid-template-columns: 1fr; gap: 1.6rem; }
            .profile { text-align: center; padding: 0; }
            .portrait { width: 94px; margin: 0 auto .85rem; }
            h1 { font-size: clamp(2.35rem, 8vw, 3.7rem); letter-spacing: -.058em; }
            h1 span { display: inline; }
            .profile p { margin-top: .5rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            .link { transition: none; }
        }
    </style>
</head>
<body>
    <main>
        <header class="profile">
            <img class="portrait" src="/links-assets/perfil.jpg" width="480" height="480" alt="Foto de perfil de Killyan Scherk" fetchpriority="high">
            <h1><span>Killyan</span> <span>Scherk</span></h1>
            <p>Atleta e criador de conteúdo fitness</p>
            <p class="handle">@killyanss</p>
        </header>

        <div>
            <nav aria-label="Links de Killyan Scherk">
                <ul class="links">
                    <li>
                        <a class="link primary" href="https://forms.gle/HmbNpQNCStp9dCFG9">
                            <span><strong>Consultoria comigo</strong><small>(lista de espera)</small></span>
                            <span class="arrow" aria-hidden="true">↗</span>
                        </a>
                    </li>
                    <li>
                        <a class="link" href="https://docs.google.com/document/d/15MtBe-vhyfo_fk7Q--4Fxvum4FTevNWfiXPBAMH4Kb0/edit?usp=sharing">
                            <span><strong>Suplementos que eu uso</strong><small>(PDF Gratuito)</small></span>
                            <span class="arrow" aria-hidden="true">↗</span>
                        </a>
                    </li>
                    <li>
                        <a class="link" href="https://www.youtube.com/@killyanss" target="_blank" rel="noopener noreferrer">
                            <strong>Meu canal no YouTube</strong>
                            <span class="arrow" aria-hidden="true">↗</span>
                        </a>
                    </li>
                    <li>
                        <a class="link" href="https://www.maxtitanium.com.br/" target="_blank" rel="noopener noreferrer">
                            <span><strong>Max Titanium</strong><small>Suplementos com Desconto com <span class="coupon">Cupom: "Ki"</span></small></span>
                            <span class="arrow" aria-hidden="true">↗</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <footer>
                <a class="media-kit" href="/mediakit/">Media Kit 2027 <span aria-hidden="true">↗</span></a>
                <a href="mailto:contatokillyan@gmail.com">contatokillyan@gmail.com</a>
            </footer>
        </div>
    </main>
</body>
</html>
